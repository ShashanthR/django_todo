<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODO LIST - Home</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <style>
        .form-control{
        padding: 1.375rem .75rem !important;
    }
    </style>
</head>
<body>
    <div class="container">
        <h3 class="pt-5 text-center">Django ToDo App</h3>
        <div class="row">
            <h4>My Day</h4>
            <p class="text-muted">{% now "jS F Y" %}</p>
            <div class="col-md-7 col-lg-7" style="height: 450px; overflow: scroll;">
                {% for task in tasks %}
                <div class="card m-1">
                    <div class="card-body d-flex justify-content-between align-items-start gap-2">
                        <span>{{ task.task }}</span>
                        
                        <div class="d-flex flex-wrap gap-1">
                            <form action="{% url 'mark_as_done' task.pk %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-success"><i class="fa fa-check"></i> Mark as Done</button>
                            </form>
                            <details>
                                <summary class="btn btn-primary"><i class="fa fa-pencil"></i> Edit</summary>
                                <form action="{% url 'editTask' task.pk %}" method="post" class="mt-2">
                                    {% csrf_token %}
                                    <input type="text" name="task" value="{{ task.task }}" maxlength="250" required class="form-control">
                                    <button type="submit" class="btn btn-primary mt-1">Save</button>
                                </form>
                            </details>
                            <form action="{% url 'deleteTask' task.pk %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-danger" aria-label="Delete {{ task.task }}"><i class="fa fa-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
                {% endfor %}
               
            </div>
            <div class="col-md-5 col-lg-5">
                <h5>Completed Tasks</h5>
                <!-- List of all the tasks that have completed -->
                {% for task in completed_tasks %}
                <div class="card m-1">
                    <div class="card-body d-flex justify-content-between align-items-start gap-2">
                        <span>{{ task.task }}</span>
                        <form action="{% url 'undoTask' task.pk %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-warning"><i class="fa fa-undo"></i> Undo</button>
                        </form>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="row">
            <div class="col-md-6 col-lg-6 p-0" style="position: absolute; bottom: 50px;">
                <!-- To Do Form -->
                <form action="{% url 'addTask' %}" method="POST">
                    {% csrf_token %}
                    <div class="form-group">
                        <span style="display: flex;">
                            <input type="text" name="task" class="form-control" placeholder="Add a task" maxlength="250" required>
                            <button type="submit" class="btn btn-primary" style="width: 200px;"><i class="fa fa-plus"></i> Add</button>
                        </span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
